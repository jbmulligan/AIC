<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Clip Indexer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; color: #333; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    video { width: 100%; border-radius: 6px; background: #000; margin-bottom: 1rem; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    button { background: #0066cc; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    textarea { height: 80px; resize: vertical; }
    .status { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
  </style>
</head>
<body>

  <div class="card">
    <div class="controls" style="margin-top: 15px; display: flex; align-items: center; gap: 10px; justify-content: center;">
      <button id="prevBtn" onclick="prevClip()">← Previous</button>

      <div style="display: flex; align-items: center; gap: 5px;">
        <label for="jumpInput"><strong>Go to Clip:</strong></label>
        <input type="number" id="jumpInput" min="1" max="532" style="width: 70px; padding: 5px;" placeholder="1-532">
        <button onclick="jumpToClipInput()">Go</button>
      </div>

      <button id="nextBtn" onclick="nextClip()">Next →</button>

    </div> 
    <!-- Label Search Control -->
    <!-- Filter & Search Controls -->
<div class="filter-container" style="margin: 10px 0; display: flex; align-items: center; gap: 15px;">
  <div>
    <label for="labelSearch">Filter by Label:</label>
    <input
      type="text"
      id="labelSearch"
      placeholder="Type to filter..."
      oninput="applyFilters()"
      style="padding: 6px 10px; font-size: 14px; width: 200px;"
    />
  </div>

  <div style="display: flex; align-items: center; gap: 5px;">
    <input
      type="checkbox"
      id="unlabelledOnly"
      onchange="applyFilters()"
    />
    <label for="unlabelledOnly" style="cursor: pointer;">Unlabelled Only</label>
  </div>

  <span id="searchCount" style="font-size: 13px; color: #666;"></span>
  <span id="clipLabelDisplay" style="font-size: 13px; color: #666;"></span>

</div>


    <!-- Video Player -->
    <video id="videoPlayer" controls autoplay muted preload="auto" playsinline webkit-playsinline style="max-width: 100%; height: auto;">
      Your browser does not support HTML5 video.
    </video>
 
    <!-- Container for displaying existing annotations -->
<div id="existingAnnotations" style="margin-top: 15px; padding: 12px; background-color: #f8f9fa; border: 1px solid #ddd; border-radius: 4px;">
  <strong>Existing Annotations:</strong>
  <div id="annotationList" style="margin-top: 8px; font-size: 0.9em; color: #333;">
    <em>Loading existing annotations...</em>
  </div>

</div>
    <!-- Labeling Form -->
    <form id="labelForm" onsubmit="submitLabel(event)">
      <div class="form-group">
        <label for="userName">Your Name / Identifier (Optional):</label>
        <input type="text" id="userName" placeholder="e.g. Alex">
      </div>

      <div class="form-group">
        <label for="description">Description / Tags / Identification:</label>
        <textarea id="description" required placeholder="Describe what happens in this clip, people present, locations, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Save & Next Clip</button>
      <div id="statusMsg" class="status"></div>
    </form>
  </div>
  <div style="text-align: center; font-size: 0.8em; color: #666; margin-top: 10px;">
  Version: <span>__VERSION__</span>
  <span id="deployTime" style="margin-left: 8px; color: #888;"></span>
</div>

<script src="clipper.js">
</script>

</body>
</html>
