<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Clip Indexer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; color: #333; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    video { width: 100%; border-radius: 6px; background: #000; margin-bottom: 1rem; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    button { background: #0066cc; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    textarea { height: 80px; resize: vertical; }
    .status { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
  </style>
</head>
<body>

  <div class="card">
    <div class="controls">
      <button id="prevBtn" onclick="changeClip(-1)">← Previous</button>
      <span id="clipIndicator" style="font-weight: bold;">Clip 1 of X</span>
      <button id="nextBtn" onclick="changeClip(1)">Next →</button>
    </div>

    <!-- Video Player -->
    <video id="videoPlayer" controls autoplay muted>
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Labeling Form -->
    <form id="labelForm" onsubmit="submitLabel(event)">
      <div class="form-group">
        <label for="userName">Your Name / Identifier (Optional):</label>
        <input type="text" id="userName" placeholder="e.g. Alex">
      </div>

      <div class="form-group">
        <label for="description">Description / Tags / Identification:</label>
        <textarea id="description" required placeholder="Describe what happens in this clip, people present, locations, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Save & Next Clip</button>
      <div id="statusMsg" class="status"></div>
    </form>
  </div>

  <script>
    // 1. Configuration
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLwEcNRUy0MMk7k3KVSDoLGAXx19PJMt-rIzdd0sKSPVAfxuhdMVM0KRTkQIvwYQvSNw/exec";
    
    // Array of filenames (e.g. ['clip_001.mp4', 'clip_002.mp4', ...])
    // Or generate dynamically if numbered sequentially (e.g., clip_001.mp4 to clip_300.mp4)
    const videoFolder = "https://github.com/jbmulligan/AIC/releases/download/v1.0.0/";
    const totalClips = 532; 
    const clipList = Array.from({ length: totalClips }, (_, i) => 
      `clip_${String(i + 1).padStart(3, '0')}.mp4`
    );

    let currentIndex = 0;

    // 2. Initialize Player
    function loadClip(index) {
      if (index < 0 || index >= clipList.length) return;
      currentIndex = index;
      
      const filename = clipList[currentIndex];
      document.getElementById("videoSource").src = videoFolder + filename;
      document.getElementById("videoPlayer").load();
      document.getElementById("clipIndicator").innerText = `${filename} (${currentIndex + 1} of ${clipList.length})`;
      
      // Reset form
      document.getElementById("description").value = "";
      document.getElementById("statusMsg").innerText = "";
      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === clipList.length - 1);
    }

    function changeClip(direction) {
      loadClip(currentIndex + direction);
    }

    // 3. Submit Label to Google Sheets
    async function submitLabel(event) {
      event.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMsg");
      
      submitBtn.disabled = true;
      statusMsg.className = "status";
      statusMsg.innerText = "Saving...";

      const payload = {
        clipFilename: clipList[currentIndex],
        userName: document.getElementById("userName").value.trim(),
        description: document.getElementById("description").value.trim()
      };

      try {
        // Use no-cors mode if cross-origin preflight gives issues, or standard fetch
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        statusMsg.className = "status success";
        statusMsg.innerText = "Saved successfully!";
        
        // Auto-advance to next clip after 1 second
        setTimeout(() => {
          if (currentIndex < clipList.length - 1) {
            changeClip(1);
          }
          submitBtn.disabled = false;
        }, 800);

      } catch (err) {
        statusMsg.className = "status error";
        statusMsg.innerText = "Failed to save. Please try again.";
        submitBtn.disabled = false;
      }
    }

    // Load first clip on page load
    window.onload = () => loadClip(0);
  </script>
</body>
</html>
