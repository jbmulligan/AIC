<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Clip Indexer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; color: #333; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    video { width: 100%; border-radius: 6px; background: #000; margin-bottom: 1rem; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    button { background: #0066cc; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    textarea { height: 80px; resize: vertical; }
    .status { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
  </style>
</head>
<body>

  <div class="card">
    <div class="controls" style="margin-top: 15px; display: flex; align-items: center; gap: 10px; justify-content: center;">
      <button id="prevBtn" onclick="prevClip()">← Previous</button>

      <div style="display: flex; align-items: center; gap: 5px;">
        <label for="jumpInput"><strong>Go to Clip:</strong></label>
        <input type="number" id="jumpInput" min="1" max="532" style="width: 70px; padding: 5px;" placeholder="1-532">
        <button onclick="jumpToClipInput()">Go</button>
      </div>

      <button id="nextBtn" onclick="nextClip()">Next →</button>
    </div> 

    <!-- Video Player -->
    <video id="videoPlayer" controls autoplay muted playsinline style="max-width: 100%; height: auto;">
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Labeling Form -->
    <form id="labelForm" onsubmit="submitLabel(event)">
      <div class="form-group">
        <label for="userName">Your Name / Identifier (Optional):</label>
        <input type="text" id="userName" placeholder="e.g. Alex">
      </div>

      <div class="form-group">
        <label for="description">Description / Tags / Identification:</label>
        <textarea id="description" required placeholder="Describe what happens in this clip, people present, locations, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Save & Next Clip</button>
      <div id="statusMsg" class="status"></div>
    </form>
  </div>
  <div style="text-align: center; font-size: 0.8em; color: #666; margin-top: 10px;">
  Version: <span>__VERSION__</span>
  <span id="deployTime" style="margin-left: 8px; color: #888;"></span>
</div>

  <script>
  // ==========================================
  // 1. CONFIGURATION & STATE
  // ==========================================
  // Replace these with your actual Apps Script URL and GitHub Release URL base
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLwEcNRUy0MMk7k3KVSDoLGAXx19PJMt-rIzdd0sKSPVAfxuhdMVM0KRTkQIvwYQvSNw/exec";
  const BASE_URL = "https://github.com/jbmulligan/AIC/releases/download/v1.0.0/";
  const TOTAL_CLIPS = 532;

  let currentIndex = 0; // Internal 0-based index (0 = clip_001.mp4)

  // Format index to 3-digit filename (0 -> "clip_001.mp4")
  function getClipFilename(index) {
    const numStr = String(index + 1).padStart(3, '0');
    return `clip_${numStr}.mp4`;
  }

  // Parse input string (handles "42", "042", "clip_042.mp4", or "?clip=42")
  function parseClipNumber(input) {
    if (!input) return null;
    const match = String(input).match(/\d+/);
    if (match) {
      const num = parseInt(match[0], 10);
      if (num >= 1 && num <= TOTAL_CLIPS) {
        return num - 1; // Convert 1-based number to 0-based array index
      }
    }
    return null;
  }

  // ==========================================
  // 2. CORE NAVIGATION & UI UPDATES
  // ==========================================
  function loadClip(index) {
  currentIndex = index;
  const filename = getClipFilename(currentIndex);

  const videoPlayer = document.getElementById("videoPlayer");
  const clipTitle = document.getElementById("clipTitle");
  const jumpInput = document.getElementById("jumpInput");

  if (videoPlayer) {
    videoPlayer.src = BASE_URL + filename;
    videoPlayer.load(); // Force Safari to reset media decoder state

    // Safely attempt to play and catch Safari autoplay restrictions
    const playPromise = videoPlayer.play();
    if (playPromise !== undefined) {
      playPromise.catch(error => {
        console.warn("Safari auto-play prevented:", error);
        // The controls attribute remains visible so the user can tap play manually if needed
      });
    }
  }

  if (clipTitle) clipTitle.textContent = `Clip ${currentIndex + 1} of ${TOTAL_CLIPS} (${filename})`;
  if (jumpInput) jumpInput.value = currentIndex + 1;

  // Preserve username across form resets using localStorage
  const labelForm = document.getElementById("labelForm");
  if (labelForm) {
    const savedUser = localStorage.getItem("annotator_userName") || "";
    labelForm.reset();

    const userField = document.getElementById("userName");
    if (userField) userField.value = savedUser;
  }

  // Sync clean address bar URL (?clip=42)
  const newUrl = new URL(window.location);
  newUrl.searchParams.set('clip', currentIndex + 1);
  window.history.replaceState({}, '', newUrl);
}

  function jumpToClipInput() {
    const inputVal = document.getElementById("jumpInput").value;
    const targetIndex = parseClipNumber(inputVal);

    if (targetIndex !== null) {
      loadClip(targetIndex);
    } else {
      alert(`Please enter a valid clip number between 1 and ${TOTAL_CLIPS}.`);
    }
  }

  function nextClip() {
    if (currentIndex < TOTAL_CLIPS - 1) {
      loadClip(currentIndex + 1);
    }
  }

  function prevClip() {
    if (currentIndex > 0) {
      loadClip(currentIndex - 1);
    }
  }

  // ==========================================
  // 3. PAGE INITIALIZATION & SUBMIT HANDLER
  // ==========================================
  window.addEventListener("DOMContentLoaded", () => {
    // A. Check URL parameter on load (e.g. ?clip=150)
    const urlParams = new URLSearchParams(window.location.search);
    const clipParam = urlParams.get('clip');
    const parsedIndex = parseClipNumber(clipParam);

    if (parsedIndex !== null) {
      currentIndex = parsedIndex;
    }

    // B. Load initial clip
    loadClip(currentIndex);

    // C. Setup Enter key listener for the Jump Box
    const jumpInput = document.getElementById("jumpInput");
    if (jumpInput) {
      jumpInput.addEventListener("keypress", function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          jumpToClipInput();
        }
      });
    }

    // D. FORM SUBMISSION HANDLER (Google Sheets Sync)
    const labelForm = document.getElementById("labelForm");
    if (labelForm) {
      labelForm.addEventListener("submit", function(e) {
        e.preventDefault(); // Stop default browser page reload

        const currentClipName = getClipFilename(currentIndex);
        const submitBtn = labelForm.querySelector("button[type='submit']");

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = "Saving...";
        }

        const userNameVal = document.getElementById("userName") ? document.getElementById("userName").value : "";
        if (userNameVal) {
          localStorage.setItem("annotator_userName", userNameVal);
        }

        // Build data payload for Google Sheets
        const payload = {
          timestamp: new Date().toISOString(),
          clipFilename: currentClipName,
          clipNumber: currentIndex + 1,
          // Collect form field values (ensure these IDs match your HTML form input IDs)
          userName: document.getElementById("userName").value.trim(),
          description: document.getElementById("description").value.trim()
		/*
          annotator: document.getElementById("userName") ? document.getElementById("userName").value : "",
          label: document.getElementById("label") ? document.getElementById("label").value : "",
          notes: document.getElementById("notes") ? document.getElementById("notes").value : ""
	  */
        };

        // Post data to Google Apps Script Web App
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(() => {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Save & Next Clip";
          }

          // Move to the next sequential clip
          if (currentIndex < TOTAL_CLIPS - 1) {
            loadClip(currentIndex + 1);
          } else {
            alert("Congratulations! You have reached the final clip.");
          }
        })
        .catch((err) => {
          console.error("Submission Error:", err);
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Save & Next Clip";
          }
          alert("Failed to save entry. Please check your network connection and try again.");
        });
      });
    }
    // Restore saved username on page load
    const userField = document.getElementById("userName");
    if (userField) {
      userField.value = localStorage.getItem("annotator_userName") || "";

      // Save name immediately if they edit it directly
      userField.addEventListener("input", function() {
        localStorage.setItem("annotator_userName", this.value);
      });
    }

  });
</script>
